<text x="25" y="494" fill="white" font-size="18">Observed action IDs in held-out episodes</text>
<text x="25" y="517" fill="#b9cce1" font-size="13">Each stack uses the same eight easy and four hard levels. Exact counts in action_usage.svg.</text>
<text x="25" y="660" fill="#b9cce1" font-size="13">Every Ninja ID is wired and reachable by a distinct motor spike; usage in these games is measured separately.</text>
